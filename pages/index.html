<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自作アプリの配布元</title>
<style>
  :root { --bg: #f7f5ef; --fg: #1d2238; --muted: #5d6478; --accent: #2f4a86; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141826; --fg: #eef0f6; --muted: #a3a9bb; --accent: #8fa8e6; --card: #1e2335; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin: 16px 0; }
  a.button { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none;
             padding: 14px; border-radius: 12px; font-weight: 600; margin: 10px 0; }
  code { word-break: break-all; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>自作アプリの配布元</h1>
  <p>iPhone の Safari でこのページを開き、下のボタンで SideStore にソースを追加します。</p>
  <div class="card">
    <a class="button" href="sidestore://source?url={{SOURCE_URL}}">SideStore に追加</a>
    <p>ボタンが効かないときは、SideStore の「Sources」→「＋」に次の URL を貼ります。</p>
    <code>{{SOURCE_URL}}</code>
  </div>
</main>
</body>
</html>
